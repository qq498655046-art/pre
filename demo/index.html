<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rooster POS · 备菜流程</title>
  <link rel="stylesheet" href="./styles.css?v=direct-quantity-1" />
</head>
<body>
  <main class="demo-stage">
    <section id="home" class="screen active" aria-label="Rooster POS 首页">
      <div class="app-canvas home-canvas">
        <header class="app-home-header"><div class="app-brand"><span class="brand-dot"></span><b>ROOSTER POS</b></div><div class="home-status">● 网络正常</div><div class="home-head-actions"><button aria-label="扫码">⌘</button><button aria-label="设置">☰</button></div></header>
        <div class="home-body"><section class="home-welcome"><time>06:44 PM</time><p>周三，8月26日</p><div class="staff-card"><b>欢迎，zack</b><button>上班打卡</button></div></section><section class="order-type-panel"><div class="primary-type-grid"><button id="open-order" class="home-type"><img src="./assets/app-icons/dine-in.png" alt="" /><span>点餐</span></button><button class="home-type"><img src="./assets/app-icons/to-go.png" alt="" /><span>打包</span></button><button class="home-type"><img src="./assets/app-icons/recall.png" alt="" /><span>查单</span></button><button class="home-type"><img src="./assets/app-icons/daily-closing.png" alt="" /><span>结账</span></button></div><div class="secondary-type-grid"><button class="home-type"><img src="./assets/app-icons/online-order.png" alt="" /><span>网络订单</span></button><button class="home-type"><img src="./assets/app-icons/call-in.png" alt="" /><span>电话订单</span></button><button class="home-type"><img src="./assets/app-icons/delivery.png" alt="" /><span>外卖订单</span></button><button id="open-prep" class="home-type prep-home-type"><img src="./assets/app-icons/drawer.png" alt="" /><span>备菜</span></button><button class="home-type"><img src="./assets/app-icons/report-center.png" alt="" /><span>报表</span></button><button class="home-type"><img src="./assets/app-icons/attendance.png" alt="" /><span>考勤</span></button><button class="home-type"><img src="./assets/app-icons/card-readers.png" alt="" /><span>刷卡机</span></button><button class="home-type"><img src="./assets/app-icons/payment-batch.png" alt="" /><span>现金收支</span></button></div></section></div>
      </div>
    </section>

    <section id="order" class="screen" aria-label="Rooster POS 点餐页"><div class="app-canvas order-code-canvas"><section class="order-code-aside"><header><button id="close-order" aria-label="返回首页">‹</button><b>#0</b><span>新单</span><button class="aside-more">⋮</button></header><div class="order-code-empty">请选择右侧商品</div><footer><p><span>小计</span><b>$0.00</b></p><p><span>税</span><b>$0.00</b></p><button class="order-pay">付款 · $0.00</button></footer></section><section class="order-code-main"><header class="order-code-top"><button class="menu-name">POS菜单⌄</button><div class="order-code-tools"><button>⌕</button><button>⟳</button><button>◎</button><button>☰</button></div></header><div class="order-code-content"><aside class="order-category-list"><button class="active">主食</button><button>热菜</button><button>素菜</button><button>饮品</button></aside><main><div class="order-qty-row"><span>QTY</span><button class="active">1</button><button>2</button><button>3</button><button>4</button><button>5</button><button>6</button><button>7</button><button>8</button><button>9</button><button>10</button></div><div class="order-product-grid"><button><b>猪脚饭</b><span>$12.95</span></button><button><b>宫保鸡丁饭</b><span>$11.95</span></button><button><b>番茄炒蛋饭</b><span>$10.95</span></button><button><b>香菇鸡饭</b><span>$10.95</span></button><button><b>鱼香肉丝饭</b><span>$12.95</span></button><button><b>麻婆豆腐饭</b><span>$11.95</span></button></div></main></div></section></div></section>

    <section id="prep" class="screen" aria-label="内部备菜">
      <div class="prep-order-canvas">
        <section class="prep-cart" aria-label="备菜清单">
          <header class="prep-cart-head"><button id="back-home" class="prep-back" aria-label="返回首页">‹</button><strong>备菜</strong><span>内部备菜</span></header>
          <div id="prep-cart-list" class="prep-cart-list"></div>
          <footer class="prep-cart-footer"><div class="prep-cart-actions"><button id="send-kitchen" class="cart-send">送厨</button></div></footer>
        </section>
        <aside id="prep-action-rail" class="prep-action-rail" aria-label="备菜操作"></aside>
        <section class="prep-menu-pane" aria-label="内部备菜菜单"><header class="prep-menu-top"><button class="prep-menu-select">内部备菜⌄</button><div class="prep-quick-actions"><button aria-label="搜索">⌕</button><button aria-label="刷新">⟳</button><button aria-label="语言">◎</button><button aria-label="菜单">☰</button></div></header><div id="prep-category-grid" class="prep-category-grid"></div><div id="prep-menu-grid" class="prep-menu-grid"></div></section>
        <div id="prep-toast" class="prep-toast" role="status" aria-live="polite"></div>
      </div>
    </section>

  </main>
  <script src="./app.js"></script>
</body>
</html>
