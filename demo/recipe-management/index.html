<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Rooster POS · 菜单管理备菜</title>
<link rel="stylesheet" href="../config.css?v=prep-recipe-6" />
</head>
<body>
<main class="config-stage">
<section class="config-shell">
<header class="page-head">
<a id="return-pos" class="back-link" href="../index.html">← 返回 POS</a>
<button id="back-list" class="editor-page-back" hidden aria-label="返回备菜">←</button>
<h1 id="page-title">备菜</h1>
<button id="header-save" class="head-action" form="recipe-form" type="submit" hidden>保存</button>
</header>
<div class="menu-layout">
<aside class="menu-sidebar">
<div class="side-heading">菜单管理</div>
<button class="nav-item">
<span class="nav-glyph">▦</span>概览</button>
<button class="nav-item">
<span class="nav-glyph">▤</span>菜单</button>
<button class="nav-item">
<span class="nav-glyph">◐</span>分类</button>
<button class="nav-item">
<span class="nav-glyph">♜</span>商品</button>
<button class="nav-item">
<span class="nav-glyph">◇</span>规格</button>
<button class="nav-item">
<span class="nav-glyph">◒</span>偏好</button>
<button class="nav-item active">
<span class="nav-glyph">♨</span>备菜</button>
</aside>
<section class="menu-content">
<section id="recipe-list-page" class="recipe-list-page">
<div class="list-toolbar">
<div class="list-title-group"><label class="recipe-search"><span>⌕</span><input id="recipe-search" placeholder="搜索名称" aria-label="搜索备菜名称" /></label></div>
<div class="list-actions"><button id="delete-recipes" class="outline-btn delete-btn" type="button" disabled>删除</button><button id="open-editor" class="primary-btn">＋ 新增</button></div>
</div>
<div class="recipes-table">
<div class="table-head">
<button id="select-all-recipes" class="list-check" type="button" role="checkbox" aria-checked="false" aria-label="全选备菜配方"></button>
<span>名称</span>
<span>关联商品</span>
<span>批次份数</span>
<span>送厨方式</span>
<span>状态</span>
<span>操作</span>
</div>
<div id="recipe-rows">
</div>
</div>
</section>
<section id="recipe-editor" class="recipe-editor" hidden>
<form id="recipe-form" class="recipe-form">
<section class="form-section full">
<h3>基础信息</h3>
<div class="form-grid recipe-base-grid">
<div class="field">
<label for="recipe-name">名称 *</label>
<input id="recipe-name" placeholder="例如：猪脚饭预制" required />
</div>
<div class="field">
<label for="batch-size">批次份数 *</label>
<input id="batch-size" type="number" min="1" value="20" required />
</div>
</div>
</section>
<section class="form-section full associated-products-section">
<div class="section-title-row">
<h3>关联商品 *</h3>
<button id="open-product-picker" class="text-add-button" type="button">＋ 新增</button>
</div>
<div class="associated-products-table">
<div class="associated-products-head"><span>□</span><span></span><span>商品</span><span>价格</span><span>操作</span></div>
<div id="associated-product-row"></div>
</div>
</section>
<section class="form-section full delivery-section">
<div id="delivery-fields" class="delivery-fields">
<div class="delivery-field-row">
<label>发送到 KDS</label>
<div class="route-card-list" role="group" aria-label="KDS 工位">
<button type="button" class="route-card" data-route-group="kds" data-route-value="热厨工位">热厨工位</button>
<button type="button" class="route-card" data-route-group="kds" data-route-value="凉菜工位">凉菜工位</button>
</div>
</div>
<div class="delivery-field-row">
<label>发送到厨房打印机</label>
<div class="route-card-list" role="group" aria-label="厨房打印机">
<button type="button" class="route-card" data-route-group="printer" data-route-value="热厨出单机">热厨出单机</button>
<button type="button" class="route-card" data-route-group="printer" data-route-value="凉菜出单机">凉菜出单机</button>
</div>
</div>
<div id="robot-option" class="delivery-field-row hidden">
<div class="robot-switch-line">
<label for="robot-enabled">发送到 Next Robot</label>
<label class="route-switch" aria-label="启用 Next Robot 送厨"><input id="robot-enabled" type="checkbox" /><span></span></label>
</div>
</div>
</div>
<p id="robot-hint" class="robot-hint" hidden>请先在「第三方应用集成 → 厨房系统」绑定 Next Robot，才可使用机器人送厨。</p>
</section>
<p id="form-message" class="form-message">
</p>
</form>
</section>
</section>
</div>
<div id="product-modal" class="modal" hidden>
<section class="product-modal-card" role="dialog" aria-modal="true" aria-label="关联商品">
<header class="product-modal-head">
<h2>关联商品</h2>
<button id="close-product-picker" class="close-btn" aria-label="关闭关联商品">×</button>
</header>
<div class="product-filters">
<label>
<span class="search-glyph">⌕</span>
<input id="product-search" placeholder="搜索商品" />
</label>
<button class="filter-button">全部菜单⌄</button>
<button class="filter-button">全部分类⌄</button>
</div>
<div class="product-panes">
<section class="product-panel">
<header>
<span>□</span>
<b>未选商品</b>
</header>
<div id="available-products" class="product-list">
</div>
</section>
<div class="transfer-actions">
<button id="move-to-selected" aria-label="移入已选商品">›</button>
<button id="move-to-available" aria-label="移回未选商品">‹</button>
</div>
<section class="product-panel">
<header>
<span>□</span>
<b>已选商品</b>
</header>
<div id="chosen-product" class="product-list">
</div>
</section>
</div>
<footer class="product-modal-footer">
<button id="cancel-product-picker" class="outline-btn">取消</button>
<button id="confirm-product-picker" class="primary-btn">确定</button>
</footer>
</section>
</div>
</section>
</main>
<div id="toast" class="toast" role="status">
</div>
<script src="./app.js?v=search-bulk-3">
</script>
</body>
</html>
