<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Rooster POS · 商品</title>
<link rel="stylesheet" href="../config.css?v=product-page-v2" />
</head>
<body>
<main class="config-stage"><section class="config-shell">
<header class="page-head"><a id="return-pos" class="back-link" href="../index.html">← 返回 POS</a><button id="back-list" class="editor-page-back" hidden aria-label="返回商品">←</button><h1 id="page-title">商品</h1><button id="header-save" class="head-action" form="product-form" type="submit" hidden>保存</button></header>
<div class="menu-layout"><aside class="menu-sidebar"><div class="side-heading">菜单管理</div><button class="nav-item"><span class="nav-glyph">▦</span>概览</button><a class="nav-item" href="../recipe-management/index.html"><span class="nav-glyph">▤</span>菜单</a><button class="nav-item"><span class="nav-glyph">◐</span>分类</button><button class="nav-item active"><span class="nav-glyph">♜</span>商品</button><button class="nav-item"><span class="nav-glyph">◇</span>规格</button><button class="nav-item"><span class="nav-glyph">◒</span>偏好</button></aside>
<section class="menu-content product-management-content">
<section id="product-list-page" class="product-list-page"><div class="list-toolbar product-toolbar"><div class="list-title-group"><label class="recipe-search"><span>⌕</span><input id="product-search" placeholder="搜索" aria-label="搜索商品" /></label><button class="filter-btn" type="button">全部菜单⌄</button><button class="filter-btn" type="button">全部类别⌄</button></div><div class="list-actions"><button id="open-product-editor" class="primary-btn">＋ 新增</button><button class="outline-btn" type="button">批量编辑⌄</button><button id="delete-products" class="outline-btn delete-btn" type="button" disabled>删除</button></div></div><div class="products-table"><div class="products-head"><button id="select-all-products" class="list-check" type="button" aria-label="全选商品"></button><span>名称</span><span>分类</span><span>颜色</span><span>价格</span><span>税</span><span>打印机</span><span>状态</span><span>操作</span></div><div id="product-rows"></div></div></section>
<section id="product-editor" class="recipe-editor" hidden><form id="product-form" class="recipe-form product-form-v1"><section class="form-section full product-name-section"><div class="product-name-grid"><div class="menu-field"><label for="product-name-en">名称</label><input id="product-name-en" placeholder="名称（英文）" /><input id="product-name-zh" placeholder="名称（中文）" /></div><div class="menu-field"><label for="kitchen-name-en">送厨名称（可选）</label><input id="kitchen-name-en" placeholder="名称（英文）" /><input id="kitchen-name-zh" placeholder="名称（中文）" /></div><div class="menu-field"><label for="product-pos-en">POS名称（可选）</label><input id="product-pos-en" placeholder="名称（英文）" /><input id="product-pos-zh" placeholder="名称（中文）" /></div></div></section><section class="form-section full product-price-section"><div class="product-price-grid"><div class="compact-field"><label for="product-price">价格</label><div class="currency-input"><span>$</span><input id="product-price" placeholder="价格" inputmode="decimal" /></div></div><div class="compact-field"><label>商品类型</label><div class="product-radio-line"><label><input type="radio" name="product-type" checked />普通商品</label><label><input type="radio" name="product-type" />称重商品(lb)</label></div></div><div class="compact-field"><label>状态</label><div class="menu-status-row"><label class="route-switch"><input id="product-enabled" type="checkbox" checked /><span></span></label><b>激活</b></div></div></div></section><section class="form-section full product-routing-section figma-product-routing"><div class="routing-field"><h3>税</h3><div class="route-card-list"><button class="route-card selected" type="button">Tax(10%) (10.0%)</button><button class="route-card" type="button">3.00%(3.0%)</button><button class="route-card" type="button">7.45%(7.45%)</button></div></div><div class="routing-field"><label class="routing-check"><input type="checkbox" checked />发送到厨房打印机</label><div class="route-card-list"><button class="route-card selected" type="button">厨房</button></div></div><div class="routing-field"><label class="routing-check"><input type="checkbox" checked />发送到 KDS</label><div class="route-card-list"><button class="route-card selected" type="button">KDS 01</button><button class="route-card" type="button">KDS 02</button></div></div><div id="product-robot-option" class="routing-field robot-routing-field"><label class="routing-check"><input id="product-robot-enabled" type="checkbox" />发送到 Next Robot</label></div><div class="routing-field category-routing-field"><h3>关联分类</h3><button class="category-picker" type="button"><span>选择分类</span><b>›</b></button></div></section></form></section>
</section></div></section></main><div id="toast" class="toast" role="status"></div><script src="./app.js?v=product-page-v2"></script>
</body>
</html>
