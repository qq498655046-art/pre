<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rooster POS · 备菜流程原型</title>
    <link rel="stylesheet" href="./styles.css?v=pin-comments-v2" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand"><span>◈</span> Rooster POS<br />备菜流程</div>
        <nav id="feature-nav" class="feature-nav" aria-label="功能清单"></nav>
      </aside>
      <main class="workspace">
        <header class="topbar"><div class="topbar-left"><div class="breadcrumb"><span id="crumb-group"></span><span>/</span><strong id="crumb-page"></strong></div></div><div class="topbar-actions"><button id="view-comments" class="view-comments" type="button">查看评论 <span id="comment-count" class="comment-badge">0</span></button><button id="comment-toggle" class="comment-toggle" type="button">评论</button><span class="device-label">1280 × 800 · 平板原型</span></div></header>
        <section class="canvas-wrap"><div id="device-stage" class="device-stage"><iframe id="preview-frame" title="原型预览"></iframe><div id="comment-layer" class="comment-layer" aria-label="页面评论标注层"></div><section id="comment-editor" class="comment-editor" hidden><header class="comment-editor-head"><strong id="comment-editor-title">添加评论</strong><button id="comment-editor-close" class="icon-button" type="button" aria-label="关闭评论">×</button></header><form id="comment-form" class="comment-form"><label>评论内容<textarea id="comment-body" maxlength="1000" placeholder="请输入评论内容"></textarea></label><button class="comment-submit" type="submit">提交评论</button></form><article id="comment-detail" class="comment-detail" hidden><p id="comment-detail-meta"></p><p id="comment-detail-body"></p><div id="comment-replies" class="comment-replies"></div><form id="reply-form" class="reply-form"><textarea id="reply-body" maxlength="1000" placeholder="回复评论"></textarea><button type="submit">回复</button></form><button id="comment-resolve" class="resolve-button" type="button">标记已解决</button></article></section></div></section>
      </main>
    </div>
    <dialog id="reviewer-dialog" class="reviewer-dialog"><form id="reviewer-form" method="dialog"><h2>开始评论</h2><p>请先保存评论人的名称。</p><label>评论人名称<input id="reviewer-name" maxlength="40" placeholder="请输入名称" autofocus /></label><div class="reviewer-actions"><button id="reviewer-cancel" type="button">取消</button><button type="submit">进入标注模式</button></div></form></dialog>
    <aside id="comment-list-panel" class="comment-list-panel" aria-hidden="true"><header class="comment-list-head"><strong>评论列表</strong><button id="comment-list-close" class="icon-button" type="button" aria-label="关闭评论列表">×</button></header><div id="all-comment-list" class="all-comment-list"></div></aside>
    <script src="./app.js?v=pin-comments-v4"></script>
  </body>
</html>
